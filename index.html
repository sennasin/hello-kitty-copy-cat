<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paint with CSS: Hello Kitty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="kitty">
    <!-- back layer -->
    <div class="ear left"></div>
    <div class="ear right"></div>

    <!-- middle layer -->
    <div class="head"></div>

    <!-- face -->
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="nose"></div>

    <!-- whiskers -->
    <div class="whisker left a"></div>
    <div class="whisker left b"></div>
    <div class="whisker left c"></div>
    <div class="whisker right a"></div>
    <div class="whisker right b"></div>
    <div class="whisker right c"></div>

    <!-- front layer -->
    <div class="bow">
      <div class="loop l"></div>
      <div class="loop r"></div>
      <div class="knot"></div>
    </div>
  </div>
</body>
</html>
